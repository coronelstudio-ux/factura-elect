<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1E7B4C">
<title>Facturador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Facturador">
<script>try{var t=localStorage.getItem("fe_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="row1">
      <h1 id="title">Inicio</h1>
      <span class="env" id="envChip">Prueba</span>
    </div>
    <div class="company" id="companyLine"></div>
  </header>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" aria-label="Navegación principal" style="--tabs:5">
    <button class="tab" data-go="home"><span class="ico">&#8962;</span>Inicio</button>
    <button class="tab" data-go="new"><span class="ico">&#43;</span>Nueva</button>
    <button class="tab" data-go="pedidos"><span class="ico">&#128230;</span>Pedidos<span class="badge hidden" id="pedBadge"></span></button>
    <button class="tab" data-go="history"><span class="ico">&#9776;</span>Historial</button>
    <button class="tab" data-go="settings"><span class="ico">&#9881;</span>Ajustes</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="../vendor/lz-string.min.js"></script>
<script src="../vendor/jsQR.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/tenant.js"></script>
<script src="kude-pdf.js"></script>
<script src="app.js"></script>
</body>
</html>

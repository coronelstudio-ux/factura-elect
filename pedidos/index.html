<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1F5AA6">
<title>Pedidos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<script>try{var t=localStorage.getItem("fe_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* Pedidos usa azul para no confundirla con el Facturador (verde) */
  :root { --accent: #1F5AA6; --accent-strong: #184A8A; --accent-soft: #E6EEF8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #7FB0F0; --accent-strong: #9AC2F5; --accent-soft: #1A2A40; --accent-text: #0F1712; } }
  :root[data-theme="dark"] { --accent: #7FB0F0; --accent-strong: #9AC2F5; --accent-soft: #1A2A40; --accent-text: #0F1712; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="row1">
      <h1 id="title">Nuevo pedido</h1>
      <span class="env">Pedidos</span>
    </div>
    <div class="company" id="companyLine"></div>
  </header>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" aria-label="Navegación principal" style="--tabs:4">
    <button class="tab" data-go="new"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>Nuevo</button>
    <button class="tab" data-go="list"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>Pedidos</button>
    <button class="tab" data-go="clients"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg></span>Clientes</button>
    <button class="tab" data-go="settings"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></span>Ajustes</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="../vendor/lz-string.min.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../vendor/jsQR.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/tenant.js"></script>
<script src="app.js"></script>
</body>
</html>
